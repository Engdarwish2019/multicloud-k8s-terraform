# Manual plan against a real cloud account. No long-lived keys: every cloud uses
# GitHub OIDC federation. Configure these repository variables first:
#   AWS:   AWS_ROLE_ARN
#   Azure: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   GCP:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID
#   all:   API_ALLOWED_CIDRS (JSON list, for example ["203.0.113.10/32"])
name: plan

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud to plan
        type: choice
        options: [aws, azure, gcp]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.cloud }}
    defaults:
      run:
        working-directory: envs/${{ inputs.cloud }}
    env:
      TF_VAR_api_allowed_cidrs: ${{ vars.API_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: AWS credentials (OIDC)
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Azure login (OIDC)
        if: inputs.cloud == 'azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure provider environment
        if: inputs.cloud == 'azure'
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
            echo "ARM_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
            echo "TF_VAR_subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"
          } >> "$GITHUB_ENV"

      - name: Google credentials (Workload Identity Federation)
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: GCP project
        if: inputs.cloud == 'gcp'
        run: echo "TF_VAR_project_id=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: 1.9.8

      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color
