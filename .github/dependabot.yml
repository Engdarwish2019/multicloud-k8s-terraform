version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories:
      - /envs/aws
      - /envs/azure
      - /envs/gcp
      - /modules/aws-eks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
